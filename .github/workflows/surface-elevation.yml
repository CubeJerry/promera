name: Surface elevation CPU checks

on:
  pull_request:
  push:
    branches: [feature/surface-elevation]

permissions:
  contents: read

concurrency:
  group: surface-elevation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-launcher-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy scipy pandas matplotlib omegaconf==2.3.0 gemmi pytest pytest-cov
      - name: Compile source and validate launch scripts
        run: |
          python -m compileall -q promera_angles experiments/pose_guidance
          bash -n experiments/pose_guidance/launch_surface_elevation.sh
          bash -n experiments/pose_guidance/container.sh
          bash -n experiments/pose_guidance/approach_stage.sh
      - name: Test geometry, actual launcher scripts and report lifecycle
        run: |
          python -m pytest -q experiments/pose_guidance/tests/test_surface*.py experiments/pose_guidance/tests/test_elevation_analysis.py --junitxml=surface-elevation-tests.xml
      - name: Check legacy geometry and report compatibility
        run: |
          python -m pytest -q experiments/pose_guidance/tests/test_target_relative_angles.py -k "not feature_parity_and_batched_collation and not native_mapping_and_preparation and not installed_native_features and not cif_pair_entry and not nominee_setups"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-elevation-cpu-results
          path: |
            surface-elevation-tests.xml
            surface-elevation-smoke/
