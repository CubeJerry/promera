name: Surface elevation CPU checks

on:
  pull_request:
  push:
    branches: [feature/surface-elevation]

permissions:
  contents: read

concurrency:
  group: surface-elevation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-launcher-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy scipy pandas matplotlib omegaconf==2.3.0 gemmi pytest pytest-cov mypy ruff black 'tinyprot @ git+https://github.com/bjing2016/tinyprot.git@dd2178b650899460223af1a72eb5d85f9ee19619'
      - name: Install CPU PyTorch for native feature tests
        run: python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare chemical entries for synthetic native featurization
        run: |
          export TINYPROT_CACHE="$RUNNER_TEMP/tinyprot-surface-test"
          mkdir -p "$TINYPROT_CACHE"
          echo "TINYPROT_CACHE=$TINYPROT_CACHE" >> "$GITHUB_ENV"
          python - <<'PY'
          import gzip, lmdb, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["TINYPROT_CACHE"])
          lmdb.open(str(root/"taxonomy.lmdb")).close()
          env = lmdb.open(str(root/"ccd.lmdb"))
          with env.begin(write=True) as txn:
              for name in ("ALA", "GLY", "SER", "UNK"):
                  with urllib.request.urlopen(f"https://files.rcsb.org/ligands/download/{name}.cif",timeout=30) as response:
                      txn.put(name.encode(), gzip.compress(response.read()))
          env.close()
          PY
      - name: Compile source and validate launch scripts
        run: |
          python -m compileall -q promera_angles experiments/pose_guidance
          bash -n experiments/pose_guidance/launch_surface_elevation.sh
          bash -n experiments/pose_guidance/container.sh
          bash -n experiments/pose_guidance/approach_stage.sh
      - name: Check experiment formatting and Python diagnostics
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          modules = ('analysis conditioning demo footprint geometry refold report run '
                     'settings setup_input structures task').split()
          files = [f'promera_angles/{name}.py' for name in modules]
          files += sorted(str(path) for path in pathlib.Path('experiments/pose_guidance/tests').glob('test_surface_*.py'))
          files += ['experiments/pose_guidance/tests/test_elevation_analysis.py']
          subprocess.run([sys.executable, '-m', 'black', '--check', '--workers', '1', *files], check=True)
          subprocess.run([sys.executable, '-m', 'ruff', 'check', '--isolated', '--select', 'E4,E7,E9,F,I', *files], check=True)
          PY
      - name: Test geometry, native features, actual launcher scripts and report lifecycle
        run: |
          python -m pytest -q -ra experiments/pose_guidance/tests --basetemp=surface-elevation-smoke --junitxml=surface-elevation-tests.xml --cov=promera_angles.footprint --cov=promera_angles.geometry --cov=promera_angles.conditioning --cov=promera_angles.settings --cov=promera_angles.refold --cov-report=term-missing --cov-report=json --cov-fail-under=90
      - name: Type-check new estimator and versioned settings
        run: python -m mypy --strict --ignore-missing-imports --follow-imports=skip promera_angles/footprint.py promera_angles/settings.py promera_angles/refold.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-elevation-cpu-results
          path: |
            surface-elevation-tests.xml
            coverage.json
            surface-elevation-smoke/
