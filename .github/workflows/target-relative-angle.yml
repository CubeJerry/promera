name: Target-relative angle CPU tests
on:
  pull_request:
    paths: ['promera_angles/**', 'experiments/pose_guidance/**', 'promera/__main__.py', '.github/workflows/target-relative-angle.yml']
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy scipy matplotlib omegaconf 'tinyprot @ git+https://github.com/bjing2016/tinyprot.git@bca22e4b38597f47b87ec3bd61c71f9f07ab0b81'
      - run: python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Prepare four chemical dictionary entries for synthetic featurization
        run: |
          export TINYPROT_CACHE="$RUNNER_TEMP/tinyprot-test"
          mkdir -p "$TINYPROT_CACHE"
          echo "TINYPROT_CACHE=$TINYPROT_CACHE" >> "$GITHUB_ENV"
          python - <<'PY'
          import gzip, lmdb, os, pathlib, urllib.request
          root = pathlib.Path(os.environ["TINYPROT_CACHE"])
          lmdb.open(str(root/"taxonomy.lmdb")).close()  # query-only synthetic MSAs
          env = lmdb.open(str(root/"ccd.lmdb"))
          with env.begin(write=True) as txn:
              for name in ("ALA", "GLY", "SER", "UNK"):
                  with urllib.request.urlopen(f"https://files.rcsb.org/ligands/download/{name}.cif",timeout=30) as response:
                      txn.put(name.encode(), gzip.compress(response.read()))
          env.close()
          PY
      - run: python -m pytest -q experiments/pose_guidance/tests/test_target_relative_angles.py
