name: Pose guidance CPU contracts
on:
  push:
    branches: [feature/cross-chain-pose-conditioning]
    paths: ['experiments/pose_guidance/**', '.github/workflows/pose-guidance.yml']
  pull_request:
    paths: ['experiments/pose_guidance/**', '.github/workflows/pose-guidance.yml']
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2.0' 'omegaconf==2.3.0' 'pytest>=8,<9'
      - run: python -m pip install 'torch==2.9.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q experiments/pose_guidance/test_pose_guidance.py
      - run: bash -n experiments/pose_guidance/container.sh experiments/pose_guidance/run.slurm
